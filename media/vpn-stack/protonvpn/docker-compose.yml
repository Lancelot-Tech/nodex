services:
  protonvpn:
    networks:
        - media-network
    env_file: .env
    image: docker.io/qmcgaw/gluetun:latest
    container_name: protonvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports: 
      - 49893:49893 # qBittorrent WebUI Port
      - 6881:6881 
      - 6881:6881/udp
      - 9696:9696 # Prowlarr WebUI Port
      - 8191:8191 # FlareSolverr Port 
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - OPENVPN_USER=${USER}
      - OPENVPN_PASSWORD=${PASSWORD}
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=Netherlands,Germany
    volumes:
      - ./config:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  media-network:
    external: true
