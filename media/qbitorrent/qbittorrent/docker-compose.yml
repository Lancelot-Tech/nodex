services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000 
      - PGID=1000 
      - TZ=Europe/Paris 
      - WEBUI_PORT=49893 
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config 
      - /media/${USER}/Films:/films:rw
      - /media/${USER}/Séries:/series:rw
      - ${HOME}/Documents:/downloads:rw
    network_mode: "container:protonvpn"
    restart: unless-stopped

