include:
  - vpn-stack/protonvpn/docker-compose.yml
  - vpn-stack/qbittorrent/docker-compose.yml
  - jellyfin/docker-compose-jellyfin.yml

services:
  radarr:
    networks:
        - media-network
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/radarr:/config
      - ./data:/data
      - ${MEDIA_FILMS_PATH}:/films:rw
      - ${HOME}/Documents:/downloads:rw
    depends_on:
      prowlarr:
        condition: service_started
  sonarr:
    networks:
        - media-network
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/sonarr:/config
      - ./data:/data
      - ${MEDIA_SERIES_PATH}:/series:rw
      - ${HOME}/Documents:/downloads:rw
    depends_on:
      prowlarr:
        condition: service_started
  lidarr:
    networks:
        - media-network
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 8686:8686
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/lidarr:/config
      - ./data:/data
      - ${MEDIA_MUSIC_PATH}:/music:rw
      - ${HOME}/Documents:/downloads:rw
    depends_on:
      prowlarr:
        condition: service_started
  bazarr:
    networks:
        - media-network
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 6767:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/bazarr:/config
      - ./data/media:/data/media:rw
    depends_on:
      prowlarr:
        condition: service_started
  whisparr:
    networks:
        - media-network
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 6969:6969
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/whisparr:/config
      - ./data:/data
      - ${MEDIA_FILMS_PATH}:/films:rw
      - ${HOME}/Documents:/downloads:rw
    depends_on:
      prowlarr:
        condition: service_started
  sabnzbd:
    networks:
        - media-network
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 8080:8080
      - 9090:9090
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sabnzbd:/config
      - ./data/usenet:/data/usenet:rw
    depends_on:
      prowlarr:
        condition: service_started
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: "container:protonvpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/appdata/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      protonvpn:
        condition: service_healthy
      flaresolverr:
        condition: service_started
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: "container:protonvpn"
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      protonvpn:
        condition: service_healthy
  homepage:
    networks:
        - media-network
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 3000:3000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - HOMEPAGE_ALLOWED_HOSTS=*
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ./docker/appdata/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      prowlarr:
        condition: service_started
  portainer:
    networks:
        - media-network
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    depends_on:
      prowlarr:
        condition: service_started

volumes:
  portainer_data:

networks:
  media-network:
    external: true
